# Pings the hosted API twice a day. /api/health runs a query against the database,
# which keeps the free Supabase project from pausing after 7 days without activity
# (a paused project makes the public link fail).
name: Keep the hosted app alive

on:
  schedule:
    - cron: "17 3,15 * * *"   # 03:17 and 15:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health (allows ~2 minutes for the free server to wake up)
        run: |
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --max-time 120 https://fitness-agents.onrender.com/api/health; then
              exit 0
            fi
            sleep 30
          done
          echo "The hosted app did not respond. Check Render and Supabase." >&2
          exit 1
