[project]
name = "fitness-agents"
version = "0.1.0"
description = "Multi-agent fitness tracking workflow (LangGraph + Claude)"
authors = [
    { name = "Jackson Lindsey", email = "jacksonhlindsey@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.156.8",
    "google-genai>=2.32.0",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
fitness-agents = "fitness_agents.cli:main"
fitness-web = "fitness_agents.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
